[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-reuse"
version = "0.0.1"
description = "Explore browser tasks with an Agent and replay verified recipes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["litellm>=1.70,<2"]
browser = ["playwright==1.62.0"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["browser_reuse", "browser_reuse.*"]
namespaces = false
